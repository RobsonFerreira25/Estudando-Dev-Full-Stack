<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários de Teste via REST</title>
    <!-- b) Incluir a folha de estilos do Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- c) Incluir a biblioteca Java Script do VUE JS (versão 2) -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <!-- d) Se necessário, incluir JQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<!-- e) Aplicar as classes container e bg-warning ao body -->
<body class="container bg-warning">
    
    <!-- f) Definir um título h1 -->
    <h1 class="mt-4">Usuários de Teste via REST</h1>
    
    <!-- g) Acrescentar referência ao site reqres.in -->
    <p class="text-white fst-italic">Os usuários deste exemplo são fornecidos pela API de testes <a href="https://reqres.in" target="_blank" class="text-white text-decoration-none">reqres.in</a></p>

    <!-- h) Incluir uma div com a identificação usuarios e classe CSS container-fluid -->
    <div id="usuarios" class="container-fluid">
        <!-- i) div com a classe row para painéis -->
        <div class="row">
            <!-- j) div para o painel formatada como card, 3 colunas (col-md-4), p-2, m-3 -->
            <!-- k) Atributo v-for e :key -->
            <div class="card col-md-3 p-2 m-3" v-for="(user, index) in users" :key="index" style="width: 250px;">
                <!-- l) Imagem formatada como card-img-top e origem :src -->
                <img :src="user.avatar" class="card-img-top" alt="Avatar do Usuário">
                
                <!-- m) div card-body -->
                <div class="card-body">
                    <!-- n) Título com nomes -->
                    <h5 class="card-title">{{user.first_name}} {{user.last_name}}</h5>
                    <!-- o) Parágrafo com email -->
                    <p class="card-text">{{user.email}}</p>
                </div>
            </div>
        </div>
    </div>

    <!-- p) Definir um trecho Java Script para a definição do objeto VUE JS -->
    <script>
        // a) Definir um objeto app, do tipo Vue
        var app = new Vue({
            // b) Elemento alvo
            el: '#usuarios',
            // c) Atributo data retornando vetor users vazio
            data: function() {
                return {
                    users: []
                };
            },
            // d) Evento mounted com chamada para loadUsers
            mounted: function() {
                this.loadUsers();
            },
            // e) Atributo methods
            methods: {
                // f) Implementar loadUsers via Fetch API para preenchimento do vetor
                loadUsers: function() {
                    var vm = this;
                    fetch('users.json')
                        .then(response => response.json())
                        .then(data => {
                            // A API reqres.in retorna os usuários em um array dentro da propriedade "data"
                            vm.users = data.data; 
                        })
                        .catch(error => {
                            console.error("Erro ao buscar usuários da API:", error);
                        });
                }
            }
        });
    </script>
</body>
</html>
